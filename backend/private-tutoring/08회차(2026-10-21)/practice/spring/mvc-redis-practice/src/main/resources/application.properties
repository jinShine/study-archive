spring.application.name=mvc-redis-practice

# 8080은 다른 프로젝트가 쓰고 있어서 8081 사용
server.port=8081

# Redis 접속 정보 (compose.yaml의 호스트 포트)
spring.data.redis.host=localhost
spring.data.redis.port=6380

# DispatcherServlet이 요청을 받고 응답하는 과정을 로그로 확인
logging.level.org.springframework.web.servlet.DispatcherServlet=DEBUG
