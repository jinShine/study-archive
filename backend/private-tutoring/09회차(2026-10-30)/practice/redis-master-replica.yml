# Master 1 + Replica 1
# 수업 때 쓴 파일에서 replica 쪽에 command 한 줄을 추가했다.
# 이 줄이 없으면 두 컨테이너는 서로 모르는 Redis 2대일 뿐, 복제가 일어나지 않는다.
# 실행: docker compose -f redis-master-replica.yml up -d
# 정리: docker compose -f redis-master-replica.yml down

services:
  redis-master:
    image: redis:latest
    container_name: redis-master
    ports:
      - "6379:6379"

  redis-replica:
    image: redis:latest
    container_name: redis-replica
    ports:
      - "6380:6379"
    # redis-master의 6379 포트를 복제하라 (같은 compose 안에서는 서비스 이름이 주소)
    command: redis-server --replicaof redis-master 6379
    depends_on:
      - redis-master
